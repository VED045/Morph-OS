[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morphos-backend"
version = "0.4.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.116.1", "uvicorn==0.35.0", "httpx==0.28.1", "pydantic-settings==2.10.1", "Pillow==11.3.0"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[tool.setuptools.packages.find]
include = ["morphos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
